[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "agent-memory-system"
version = "3.1.0"
description = "高度模块化的分布式智能记忆管理系统"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Agent Memory System Team", email = "team@agent-memory-system.dev"},
]
keywords = ["memory", "agent", "distributed", "raft", "gnn", "reinforcement-learning", "cqrs", "event-sourcing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "cryptography>=41.0",
    "passlib>=1.7",
    "structlog>=23.0",
    "tenacity>=8.0",
    "pyyaml>=6.0",
    "babel>=2.12",
]

[project.optional-dependencies]
ml = [
    "torch>=2.0",
    "torch-scatter",
    "transformers>=4.30",
    "sentence-transformers>=2.2",
]
api = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "pydantic>=2.0",
]
distributed = [
    "redis>=4.5",
    "consul>=1.1",
    "prometheus-client>=0.17",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "rich>=13.0",
]
all = [
    "agent-memory-system[ml,api,distributed,dev]",
]

[project.urls]
Homepage = "https://github.com/17683995446/agent-memory-system-v3"
Documentation = "https://github.com/17683995446/agent-memory-system-v3#readme"
Repository = "https://github.com/17683995446/agent-memory-system-v3"
Issues = "https://github.com/17683995446/agent-memory-system-v3/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
include = ["memory_system*"]
